<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IurisSearch · Jurisprudencia Penal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.min.js"></script>
<style>
:root{
  --cream:#F8F3E8;--beige:#EDE5D0;--beige-d:#DDD0B8;--coffee-l:#A07850;--coffee:#7B4F2E;--coffee-d:#3D2010;--coffee-h:#5C3D1E;
  --gold:#C49A2A;--gold-l:#E8C96A;--gold-p:#F5E9C0;--ink:#1E140A;--paper:#FDFAF3;
  --ok:#1a6b2e;--ok-bg:#d4f0dc;--ok-b:#a8ddb5;--bad:#922b21;--bad-bg:#fde8e8;--bad-b:#f5b8b8;
  --serif:'Playfair Display',Georgia,serif;--sans:'Source Sans 3',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{font-size:15px;line-height:1.55}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:var(--coffee)}
h1,h2,h3{font-family:var(--serif);margin:0;color:var(--ink)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:var(--beige)}::-webkit-scrollbar-thumb{background:var(--coffee-l);border-radius:99px}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}

/* Botones */
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:12px;font-weight:600;font-size:14px;transition:.15s;white-space:nowrap}
.btn-d{background:var(--coffee-d);color:var(--cream);box-shadow:0 4px 16px rgba(61,32,16,.25)}.btn-d:hover{background:var(--coffee-h)}
.btn-o{border:1px solid var(--gold);color:var(--coffee);background:rgba(196,154,42,.08)}.btn-o:hover{background:var(--gold-p)}
.btn-g{background:var(--gold);color:var(--ink)}.btn-g:hover{background:var(--gold-l)}
.btn-lg{padding:15px 28px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:default}
.link{color:var(--coffee-l);font-size:14px;display:inline-flex;align-items:center;gap:6px}.link:hover{color:var(--coffee)}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--beige-d);font-size:13px;color:var(--coffee-l);transition:.15s}
.chip.on{border-color:var(--gold);background:var(--gold-p);color:var(--coffee);font-weight:600}

/* Etiquetas */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--coffee-l)}
.mono{font-family:var(--mono)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 10px;border-radius:99px;background:var(--gold-p);color:var(--coffee);border:1px solid var(--beige-d)}
.idtag{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--coffee-d);background:var(--beige);padding:2px 10px;border-radius:8px}
.nivel{font-family:var(--mono);font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.nivel-A{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-b)}
.nivel-B{background:var(--gold-p);color:var(--coffee);border:1px solid var(--gold-l)}
.nivel-C{background:var(--beige);color:var(--coffee);border:1px solid var(--beige-d)}
.muted{color:var(--coffee-l)}.small{font-size:12.5px}

/* Tarjetas */
.card{background:#fff;border:1px solid var(--beige-d);border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(61,32,16,.04);overflow-wrap:anywhere}
.card.hover{cursor:pointer;transition:.15s}.card.hover:hover{border-color:var(--gold);box-shadow:0 4px 20px rgba(196,154,42,.15)}
.soft{background:var(--beige);border:1px solid var(--beige-d);border-radius:12px;padding:14px}
.paper{background:var(--paper);border:1px solid var(--gold);border-radius:14px;padding:18px}
.note{border-left:3px solid var(--gold);padding:8px 14px;color:var(--coffee);font-size:13px;background:var(--paper);border-radius:0 10px 10px 0}
.warn{background:var(--gold-p);border:1px solid var(--gold-l);color:var(--coffee-d);border-radius:12px;padding:10px 14px;font-size:13px}
.err{background:var(--bad-bg);border:1px solid var(--bad-b);color:var(--bad);border-radius:12px;padding:12px 16px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
ul.l{margin:6px 0 0;padding-left:18px}ul.l li{margin:3px 0}
.sec-t{font-family:var(--serif);font-size:17px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:14px}
.kv .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--coffee-l)}
.kv .v{font-size:13.5px;font-weight:500;color:var(--coffee-d)}

/* Landing */
.landing{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(135deg,#F8F3E8 0%,#EDE5D0 60%,#DDD0B8 100%)}
.lhead{display:flex;justify-content:space-between;align-items:center;padding:24px 40px;gap:12px;flex-wrap:wrap}
.lmain{flex:1;display:flex;align-items:center;gap:64px;padding:32px 40px;max-width:1240px;margin:0 auto;width:100%}
.lmain h1{font-size:clamp(36px,5vw,50px);line-height:1.12;margin-bottom:22px}
.lmain h1 em{color:var(--gold)}
.lead{font-size:18px;color:var(--coffee);margin:0 0 30px;max-width:560px}
.stats{display:flex;gap:32px;margin-top:40px;flex-wrap:wrap}
.stats b{display:block;font-family:var(--serif);font-size:24px;color:var(--coffee-d)}
.stats span{font-size:12px;color:var(--coffee-l)}
.hero-img{flex:1;max-width:500px;position:relative}
.hero-img .ph{border-radius:20px;overflow:hidden;box-shadow:0 32px 80px rgba(61,32,16,.2);height:330px;background:linear-gradient(160deg,#5C3D1E,#3D2010)}
.hero-img img{width:100%;height:100%;object-fit:cover;filter:sepia(25%) contrast(1.05);display:block}
.hero-img .cap{position:absolute;left:0;right:0;bottom:0;padding:24px;background:linear-gradient(to top,rgba(61,32,16,.75),transparent);border-radius:0 0 20px 20px;color:var(--cream);font-family:var(--serif);font-style:italic;font-size:17px}
.hero-img .float{position:absolute;top:-22px;right:-20px;background:var(--coffee-d);border-radius:14px;padding:14px 18px;box-shadow:0 8px 32px rgba(0,0,0,.25);color:var(--cream);font-size:13px;max-width:260px;text-align:left;line-height:1.4}
.lfoot{padding:18px 40px;border-top:1px solid var(--beige-d);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--coffee-l);font-size:12px}

/* Logo */
.logo{display:flex;align-items:center;gap:10px}
.logo .ic{width:36px;height:36px;border-radius:10px;background:var(--coffee-d);display:grid;place-items:center;font-size:19px;flex:none}
.logo .tx{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--coffee-d);line-height:1.1}
.logo .tx em{font-style:normal;color:var(--gold)}
.logo .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--coffee-l)}
.logo.dark .tx{color:var(--cream)}.logo.dark .ic{background:rgba(196,154,42,.2)}.logo.dark .sub{color:rgba(248,243,232,.4)}

/* App */
.app{display:flex;height:100vh;overflow:hidden}
.side{width:244px;flex:none;background:var(--coffee-d);display:flex;flex-direction:column}
.side .top{padding:20px;border-bottom:1px solid rgba(255,255,255,.1)}
.side nav{flex:1;padding:12px;overflow-y:auto}
.side .grp{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:rgba(196,154,42,.7);padding:10px 10px 6px}
.nav{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;margin-bottom:2px;color:rgba(248,243,232,.75);font-size:14px;text-align:left}
.nav svg{color:rgba(196,154,42,.65);flex:none}
.nav:hover{background:rgba(196,154,42,.1)}
.nav.on{background:rgba(196,154,42,.18);color:var(--cream);font-weight:600}.nav.on svg{color:var(--gold)}
.side .me{padding:12px;border-top:1px solid rgba(255,255,255,.1);display:flex;gap:10px;align-items:center;color:var(--cream);font-size:13px}
.side .me .av{width:32px;height:32px;border-radius:50%;background:rgba(196,154,42,.2);display:grid;place-items:center}
main.content{flex:1;overflow-y:auto}
.page{padding:32px;max-width:1040px;margin:0 auto}
.page-h{margin-bottom:26px}
.page-h h1{font-size:28px;margin-top:6px}
.page-h p{color:var(--coffee);margin:6px 0 0}

/* Búsqueda */
.editor{border:1px solid var(--beige-d);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 4px 32px rgba(61,32,16,.08)}
.editor.lleno{border-color:var(--gold);box-shadow:0 4px 32px rgba(196,154,42,.12)}
.editor .bar{background:var(--coffee-d);padding:9px 22px;font-family:var(--mono);font-size:12px;color:var(--gold)}
.editor textarea{width:100%;border:0;outline:none;resize:vertical;min-height:220px;padding:22px 24px 10px;font:inherit;font-size:14.5px;line-height:1.75;color:var(--ink);background:transparent}
.editor .foot{display:flex;justify-content:space-between;gap:10px;padding:12px 24px;border-top:1px solid var(--beige);font-family:var(--mono);font-size:12px;color:var(--coffee-l);flex-wrap:wrap}
.drop{border:2px dashed var(--beige-d);border-radius:14px;padding:20px;text-align:center;background:var(--beige);color:var(--coffee);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--gold);background:var(--gold-p)}
.file{display:inline-flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;background:var(--gold-p);border:1px solid var(--beige-d)}

/* Procesamiento */
.steps{border:1px solid var(--beige-d);border-radius:18px;overflow:hidden;background:#fff}
.step{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--beige)}
.step:last-child{border-bottom:0}
.step .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--cream);font-family:var(--mono);font-size:11px;font-weight:700;color:var(--beige-d);border:2px solid transparent}
.step.done .dot{background:var(--gold);color:#fff}
.step.cur{background:#FBF8F0}.step.cur .dot{background:var(--beige);border-color:var(--gold)}
.step .sub{font-size:12px;color:var(--coffee-l);margin-top:2px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold);border-top-color:transparent;animation:spin 1s linear infinite;margin-left:auto}
.prog{height:8px;border-radius:99px;background:var(--beige);overflow:hidden}.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--coffee),var(--gold));transition:width .6s}

/* Pestañas */
.tabs{display:flex;border-bottom:1px solid var(--beige-d);margin:22px 0;overflow-x:auto}
.tabs button{padding:12px 20px;font-size:14px;font-weight:500;color:var(--coffee-l);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--coffee-d);border-color:var(--gold)}

/* Modal y toasts */
.modal-bg{position:fixed;inset:0;background:rgba(30,20,10,.6);z-index:80;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--cream);border-radius:20px;max-width:900px;width:100%;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,.35);animation:fade .2s}
.modal .mh{padding:18px 22px;border-bottom:1px solid var(--beige-d);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.modal pre{margin:0;padding:22px;overflow:auto;white-space:pre-wrap;font-family:var(--sans);font-size:14.5px;line-height:1.8;color:var(--coffee-d);background:#fff;flex:1}
.visor-busqueda{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 20px;background:#fffaf0;border-bottom:1px solid var(--beige-d)}
.visor-busqueda input{flex:1;min-width:180px;border:1px solid var(--beige-d);border-radius:8px;padding:9px 11px;font:inherit;background:#fff;color:var(--coffee-d)}
.visor-busqueda .contador{font-size:12px;color:var(--coffee-l);min-width:95px;text-align:center}
.modal pre mark{background:#ffe18a;color:#332600;border-radius:2px;padding:0 1px}
.modal pre mark.actual{background:#f3a837;outline:2px solid #9b5c00}
.visor-aviso{padding:6px 20px;font-size:11px;color:var(--coffee-l);background:#fffaf0}
.toasts{position:fixed;right:24px;bottom:24px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:var(--cream);border-left:4px solid var(--gold);border-radius:12px;padding:12px 16px;min-width:260px;font-size:14px;box-shadow:0 8px 32px rgba(0,0,0,.3);animation:slideUp .25s}

.modal-texto-completo{max-width:1100px}
.documento-texto-oficial{overflow:auto;flex:1;background:#fff;scroll-behavior:auto}
.pagina-texto-oficial{border-bottom:2px solid var(--beige-d);scroll-margin-top:12px}
.pagina-texto-cabecera{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 20px;background:#f7f0e3;color:var(--coffee-l);font-size:12px;z-index:1}
.documento-texto-oficial pre{overflow:visible;flex:none;min-height:90px;white-space:pre-wrap;overflow-wrap:anywhere}
/* Resaltados permanentes del lector: dorado suave, distintos de la búsqueda temporal. */
.documento-texto-oficial mark.resaltado-guardado{background:#ecd49a;color:inherit;border-radius:2px;padding:0;box-shadow:inset 0 -1px 0 #b99242}
.documento-texto-oficial mark.coincidencia-texto-oficial{background:#ffe18a}
.documento-texto-oficial mark.coincidencia-texto-oficial.actual{background:#f3a837}
.visor-resaltados{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 20px;background:#f8f0dd;border-bottom:1px solid var(--beige-d)}
.visor-resaltados .small{flex:1;min-width:180px}
/* Notas */
.nota-bloque {
  background: var(--gold-p);
  border-left: 3px solid var(--gold);
  padding: 12px;
  border-radius: 6px;
  margin-bottom: 8px;
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.nota-bloque .acciones-nota {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}
.nota-bloque .acciones-nota button {
  color: var(--coffee);
  font-size: 14px;
  cursor: pointer;
  transition: 0.2s;
}
.nota-bloque .acciones-nota button:hover { color: var(--bad); }

@media(max-width:900px){
  .lmain{flex-direction:column;gap:40px;padding:24px 20px}.hero-img{display:none}.lhead,.lfoot{padding-left:20px;padding-right:20px}
  .app{flex-direction:column;height:auto;min-height:100vh;overflow:visible}
  .side{width:100%;flex-direction:row;align-items:center;overflow-x:auto}
  .side .top{border:0;padding:10px 12px}.side .top .sub,.side .grp,.side .me,.nav .soon{display:none}
  .side nav{display:flex;padding:6px;overflow:visible}.nav{white-space:nowrap;padding:8px 10px;font-size:13px}
  main.content{overflow:visible}.page{padding:18px 16px}
  .between{flex-direction:column}
}
</style>
</head>

<div id="r"></div>
<div class="toasts" id="toasts"></div>
<div id="modal"></div>
<script>
// ════════════════════════════════════════════════════════════════
//  PROTECCIÓN DE RUTA
// ════════════════════════════════════════════════════════════════
const USUARIO_ID = localStorage.getItem('usuario_id');
if (!USUARIO_ID) {
  window.location.href = '/login';
}

// ════════════════════════════════════════════════════════════════
//  ESTADO Y UTILIDADES
// ════════════════════════════════════════════════════════════════
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const OFICIALES = ['cortesuprema.gov.co', 'ramajudicial.gov.co', 'corteconstitucional.gov.co'];
const NIVEL = { A: 'Alta similitud', B: 'Similitud media', C: 'Relevancia jurídica' };
const METODO = { bm25: 'léxica (BM25)', semantica: 'semántica', hibrida: 'híbrida (léxica + semántica)' };

const CASOS_EJEMPLO = [
 {"nombre": "Hurto calificado", "termino": "hurto calificado", "descripcion": "Caso hipotético. El 12 de marzo, aproximadamente a las 8:30 p. m., una persona salía de su trabajo y caminaba hacia una estación de transporte público. Dos individuos la interceptaron; uno le mostró un cuchillo y exigió la entrega del teléfono y la billetera, mientras el otro le cerró el paso. La víctima entregó los objetos y los agresores huyeron. Quince minutos después, la Policía detuvo a un sospechoso a cuatro cuadras del lugar y encontró un teléfono con características similares, pero no recuperó el arma. La víctima realizó un reconocimiento posterior, aunque inicialmente había descrito una chaqueta de otro color. El procesado afirma que compró el teléfono a un tercero y niega haber participado en la intimidación. La Fiscalía formuló imputación por hurto calificado y agravado; el imputado no aceptó cargos y el asunto se encuentra en etapa de juicio oral. La defensa cuestiona la legalidad del reconocimiento, la suficiencia de la identificación, la coautoría y si la intimidación está demostrada. Se busca jurisprudencia sobre valoración de prueba testimonial y de reconocimiento, inferencias de participación, violencia o amenaza como circunstancia calificante y estándar de prueba para condenar."},
 {"nombre": "Homicidio", "termino": "homicidio dolo eventual", "descripcion": "Caso hipotético. Durante una reunión nocturna, dos asistentes discutieron por un daño a un vehículo. Según tres testigos, uno de ellos empujó al otro y luego utilizó una botella rota; la víctima cayó al suelo y murió horas después por una lesión vascular. El acusado sostiene que solo intentó apartar a la víctima y que no advirtió el riesgo mortal. Una cámara registra parcialmente la discusión, pero no muestra el momento exacto de la lesión. El informe de medicina legal describe la trayectoria de la herida y la posibilidad de que se produjera durante un forcejeo. La Fiscalía acusó por homicidio doloso y la defensa plantea, subsidiariamente, culpa o ausencia de intención homicida. El proceso está en juicio oral y se debate la credibilidad de los testigos, la relación causal y la valoración conjunta de video y pericia. Se solicita jurisprudencia que diferencie dolo directo, dolo eventual y culpa con representación, así como criterios probatorios para inferir conocimiento y aceptación del riesgo."},
 {"nombre": "Violencia intrafamiliar", "termino": "violencia intrafamiliar", "descripcion": "Caso hipotético. Una persona denunció que su expareja, con quien compartió vivienda y tiene un hijo menor, ejerció durante varios meses insultos, amenazas de expulsarla del hogar y episodios de empujones. Después de la separación, los contactos continuaron por asuntos de cuidado del hijo. Existen mensajes de texto, un registro de atención médica por lesiones leves y declaraciones de familiares; dos testigos no presenciaron directamente los hechos. El investigado niega la agresión física y sostiene que las discusiones fueron recíprocas. La Fiscalía presentó acusación por violencia intrafamiliar y el proceso se encuentra en audiencia preparatoria. La controversia incluye la existencia del vínculo familiar jurídicamente relevante en cada fecha, la valoración del testimonio de la presunta víctima, la reiteración de conductas y la diferencia entre conflicto familiar y maltrato penalmente relevante. Se busca jurisprudencia sobre elementos del tipo penal, violencia psicológica, contexto de dominación, prueba periférica y garantías de contradicción."},
 {"nombre": "Estafa", "termino": "estafa engaño antecedente", "descripcion": "Caso hipotético. Una pequeña comerciante transfirió varias cuotas a una persona que ofrecía maquinaria industrial a un precio inferior al mercado. Antes del pago recibió fotografías, una cotización con membrete y una promesa de entrega en treinta días. El vendedor aplazó la entrega, devolvió una suma mínima y dejó de responder. La defensa sostiene que sí existía intención de cumplir y que el proveedor incumplió, por lo cual se trataría de una controversia civil. La Fiscalía afirma que el vendedor nunca tuvo disponibilidad de la maquinaria y utilizó documentos engañosos para obtener el dinero. Se cuenta con comprobantes bancarios, conversaciones, declaraciones de otros compradores y una certificación del proveedor. El asunto está en etapa de acusación. Se discute si hubo engaño antecedente o concomitante, error determinante, disposición patrimonial, perjuicio y dolo inicial. Se busca jurisprudencia que permita distinguir estafa de incumplimiento contractual y precisar el valor probatorio de promesas, pagos parciales y comunicaciones posteriores."},

<details class="card" style="margin-bottom:18px"><summary style="cursor:pointer;font-family:var(--serif);font-weight:700;font-size:17px">Cómo entendió la IA tu caso</summary>
<div class="grid" style="margin-top:14px"><div><b>Hechos proporcionados</b>${ul(hechosProp)}</div><div><b>Hechos no confirmados</b> <span class="small muted">(dependen de las pruebas)</span>${ul(hechosNoConf)}</div>
<div><b>Problemas jurídicos</b>${ul(problemas)}</div><div><b>Delitos potencialmente relevantes</b><div style="margin-top:6px">${tags(delitosPosibles) || '<span class="muted small">No consta</span>'}</div>${informacionFaltante.length ? `<div style="margin-top:12px"><b>Información faltante</b>${ul(informacionFaltante)}</div>` : ''}</div></div></details>
${!cnt('A') && !cnt('B') ? `<div class="paper" style="margin-bottom:14px"><b>No se encontraron decisiones con un nivel de similitud significativo en el portal oficial.</b><div class="small muted" style="margin-top:4px">Los resultados mostrados solo tienen relevancia jurídica (nivel C). Es preferible decirlo a presentar casos que no son realmente comparables.</div></div>` : ''}
<div class="row" style="margin-bottom:16px"><span class="muted small">Filtrar por nivel:</span>${[['todos', 'Todos'], ['A', 'A · Alta'], ['B', 'B · Media'], ['C', 'C · Relevancia jurídica']].map(([v, l]) => `<button class="chip ${S.fn === v ? 'on' : ''}" onclick="S.fn='${v}';render()">${l}</button>`).join('')}</div>
<div class="stack">${vis.map(r => tarjeta(r)).join('') || '<p class="muted">No hay resultados con ese nivel.</p>'}</div>
${AVISO}</div>`);
};

function tarjeta(r) {
  const g = S.saved[r.id];
  return `<div class="card hover" onclick="abrir('${e(r.id)}')"><div class="between"><div style="flex:1;min-width:0">
<div class="row" style="gap:10px;margin-bottom:10px"><span class="idtag">${e(r.nombre)}</span><span class="nivel nivel-${r.nivel}">Nivel ${r.nivel} · ${NIVEL[r.nivel]}</span><span class="badge">${e(r.tipo)}</span><span class="badge">${e(r.delito_corpus)}</span><span class="small muted mono">#${r.posicion} en la búsqueda</span></div>
<div style="font-weight:500;margin-bottom:6px">${e(r.corte)} · ${e(r.sala)} · ${e(r.fecha)}</div>
<p style="color:var(--coffee);margin:0;font-size:14px">${e(r.justificacion_nivel)}</p>
<div class="kv"><div><div class="k">Ponente</div><div class="v">${e(r.ponente)}</div></div><div><div class="k">Radicación</div><div class="v">${e(r.radicado)}</div></div><div><div class="k">Pena (según la IA)</div><div class="v">${e(r.pena)}</div></div></div>
<details class="small" style="margin-top:12px" onclick="event.stopPropagation()"><summary>Ver extracto de la fuente oficial (no valida por sí solo el análisis)</summary><p style="white-space:pre-wrap">${e(r.fragmento_fuente || "Extracto no disponible")}</p></details>
<div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--beige)" class="small">${fuente(r)}</div></div>
<div class="stack" style="align-items:flex-end;gap:10px;flex:none"><button title="Guardar" onclick="event.stopPropagation();guardar('${e(r.id)}')" style="padding:8px;border-radius:9px;background:${g ? 'var(--gold-p)' : 'var(--beige)'};color:${g ? 'var(--gold)' : 'var(--coffee-l)'}">${I.book(15, g)}</button>
<button class="btn btn-d" style="padding:7px 12px;font-size:12px" onclick="event.stopPropagation();abrir('${e(r.id)}')">Ver detalle →</button></div></div></div>`;
}

const CONSULTA_CSJ = 'https://consultajurisprudencial.ramajudicial.gov.co/WebRelatoria/csj/index.xhtml';
const comoVerificar = r => `<b>Verificable en la fuente oficial:</b> <a href="${CONSULTA_CSJ}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="font-weight:600">Consulta de Jurisprudencia de la Corte Suprema ↗</a> → buscar la providencia <b class="mono">${e(r.nombre)}</b>${r.radicado && r.radicado !== 'No consta' ? ` (radicado <b class="mono">${e(r.radicado)}</b>)` : ''}`;

function fuente(r) {
  const u = urlOficial(r.url);
  return `<div style="line-height:1.9"><span class="eyebrow" style="font-size:10px">Fuente</span> &nbsp;${u ? `<a href="${e(u)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="font-weight:600">Documento oficial ↗</a> <span class="mono" style="color:var(--ok);font-size:10px">OFICIAL</span>` : comoVerificar(r)}
<br><span class="eyebrow" style="font-size:10px">Fuente oficial</span> &nbsp;<a href="#" onclick="event.preventDefault();event.stopPropagation();verTexto('${e(r.id)}')" style="font-weight:600">Ver texto completo</a> <span class="muted mono" style="font-size:11px">(${e(r.archivo)})</span></div>`;
}

V.det = () => {
  const r = S.A?.resultados?.find(x => x.id === S.sel); if (!r) return V.res();
  const A = S.A, g = S.saved[r.id];
  const T = [['similitudes', 'Similitudes'], ['resumen', 'Resumen de la decisión'], ['analisis', 'Análisis de tu caso'], ['otras', 'Otras decisiones']];
  const contenido = {
    similitudes: () => `<div class="card" style="margin-bottom:14px"><div class="sec-t">Nivel ${r.nivel} · ${NIVEL[r.nivel]}</div><p style="margin:0;color:var(--coffee)">${e(r.justificacion_nivel)}</p></div>
<div class="grid"><div class="card"><div class="sec-t" style="color:var(--ok)">✓ Similitudes con tu caso</div>${ul(r.similitudes)}</div><div class="card"><div class="sec-t" style="color:var(--bad)">≠ Diferencias con tu caso</div>${ul(r.diferencias)}</div></div>
${r.posicion_divergente ? `<div class="paper" style="margin-top:14px"><div class="sec-t">Posición divergente</div><p style="margin:0">${e(r.posicion_divergente)}</p></div>` : ''}
<div class="note" style="margin-top:14px">Comparación realizada por la IA. Que una diferencia haya sido relevante en el caso anterior no significa que tendrá el mismo efecto en tu caso.</div>`,
    resumen: () => `<div class="stack">
      ${r.hechos && r.hechos !== 'No consta' ? `<div class="card"><div class="sec-t"><span>📋</span>Hechos considerados probados</div><p style="margin:0;color:var(--coffee);line-height:1.7">${e(r.hechos)}</p></div>` : ''}
      
      ${r.problema_juridico && r.problema_juridico !== 'No consta' ? `<div class="card"><div class="sec-t"><span>⚖️</span>Problema jurídico</div><p style="margin:0;color:var(--coffee);line-height:1.7">${e(r.problema_juridico)}</p></div>` : ''}
      
      ${r.argumentos && r.argumentos !== 'No consta' ? `<div class="card"><div class="sec-t"><span>📜</span>Argumentos del tribunal</div><p style="margin:0;color:var(--coffee);line-height:1.7">${e(r.argumentos)}</p></div>` : ''}
      
      ${r.decision && r.decision !== 'No consta' ? `<div class="card"><div class="sec-t"><span>🔨</span>Decisión</div><p style="margin:0;color:var(--coffee);line-height:1.7">${e(r.decision)}</p></div>` : ''}
      
      ${r.pena && r.pena !== 'No consta' ? `<div class="card"><div class="sec-t"><span>⛓️</span>Pena</div><p style="margin:0;color:var(--coffee);line-height:1.7">${e(r.pena)}</p></div>` : ''}
      
      ${(!r.hechos && !r.problema_juridico && !r.decision) ? `<div class="warn">⚠️ La IA no generó un resumen estructurado para esta sentencia. Por favor, revisa el texto completo en la pestaña de trazabilidad.</div>` : ''}

      <div class="card"><div class="sec-t"><span>📖</span>Normas</div>${ul(r.normas)}</div>
    </div>
    <div class="note" style="margin-top:14px">Resumen generado por IA solo a partir del texto de la sentencia en el portal oficial. Verifica cada dato en la fuente antes de usarlo.</div>`,
    analisis: () => `<div class="grid"><div class="card"><div class="sec-t">Problemas jurídicos</div>${ul(A.problemas)}</div><div class="card"><div class="sec-t">Normas potencialmente aplicables</div>${ul(A.normas)}</div>
<div class="card"><div class="sec-t">Conceptos relacionados</div><div>${tags(A.conceptos) || '—'}</div></div><div class="card"><div class="sec-t">Pruebas mencionadas</div>${ul(A.pruebas)}</div></div>
<div class="card" style="margin-top:14px"><div class="sec-t">Sinónimos jurídicos relevantes</div><div class="grid">${(A.sinonimos || []).map(x => `<div class="soft"><b style="color:var(--coffee-d)">${e(x.termino)}</b><div class="small" style="color:var(--coffee)">${e((x.equivalentes || []).join(', '))}</div></div>`).join('') || '<span class="muted">—</span>'}</div></div>
<div class="card" style="margin-top:14px"><div class="sec-t">Polisemia</div>${(A.polisemia || []).map(x => `<div style="margin:4px 0"><b>${e(x.termino)}:</b> <span style="color:var(--coffee)">${e(x.sentidos)}</span></div>`).join('') || '<span class="muted">—</span>'}</div>`,
    otras: () => `<div class="stack">${(A.resultados || []).filter(x => x.id !== r.id).map(x => `<div class="card hover" onclick="abrir('${e(x.id)}')"><div class="between"><div><div class="row" style="gap:10px;margin-bottom:6px"><span class="idtag" style="font-size:13px">${e(x.nombre)}</span><span class="nivel nivel-${x.nivel}">Nivel ${x.nivel}</span><span class="small muted mono">${e(x.fecha)}</span></div><p style="margin:0;color:var(--coffee);font-size:13.5px">${e(x.justificacion_nivel)}</p></div>${I.right()}</div></div>`).join('') || '<p class="muted">No hay otras decisiones.</p>'}</div>`
  };
  return shell('search', `<div class="page"><button class="link" onclick="go('res')">${I.left(14)} Volver a resultados</button>
<div class="card" style="margin:16px 0 0"><div class="between"><div><div class="row" style="gap:10px;margin-bottom:10px"><span class="mono" style="font-size:20px;font-weight:700;color:var(--coffee-d)">${e(r.nombre)}</span><span class="nivel nivel-${r.nivel}">Nivel ${r.nivel} · ${NIVEL[r.nivel]}</span><span class="badge">${e(r.delito_corpus)}</span></div>
<h2 style="font-size:22px">${e(r.corte)}</h2><p style="color:var(--coffee);margin:4px 0 0">${e(r.sala)} · M.P. ${e(r.ponente)} · ${e(r.fecha)} · Radicación ${e(r.radicado)}</p></div>
<button class="btn ${g ? 'btn-g' : 'btn-o'}" onclick="guardar('${e(r.id)}')">${I.book(14, g)} ${g ? 'Guardado ✓' : 'Guardar'}</button></div>
<div class="paper" style="margin-top:16px"><div class="between"><div><div class="sec-t" style="margin-bottom:2px">Fuentes y trazabilidad</div><div class="small muted">Los metadatos provienen de la fuente oficial; el análisis es de la IA y debe verificarse.</div></div><span class="badge mono" style="font-size:10px">TRAZABILIDAD</span></div><div class="small" style="margin-top:10px">${fuente(r)}</div></div></div>
<div class="tabs">${T.map(([k, l]) => `<button class="${S.tab === k ? 'on' : ''}" onclick="S.tab='${k}';render()">${l}</button>`).join('')}</div>
${contenido[S.tab]()}${AVISO}</div>`);
};

V.saved = () => shell('saved', `<div class="page"><div class="page-h"><div class="eyebrow">Tu selección rápida</div><h1>Jurisprudencias guardadas</h1><p>Decisiones que has guardado para consulta rápida.</p></div>
<div class="stack" id="lista-guardadas"><div class="soft">Cargando...</div></div></div>`);

async function cargarGuardadas() {
  const res = await fetch(`/api/documentos?usuario_id=${USUARIO_ID}`);
  const data = await res.json();
  const docs = data.documentos || [];
  const contenedor = document.getElementById('lista-guardadas');
  
  if (!contenedor) return;
  if (docs.length === 0) {
    contenedor.innerHTML = '<div class="soft">Aún no has guardado decisiones. Búscalas y pulsa "Guardar".</div>';
    return;
  }

  contenedor.innerHTML = docs.map(doc => {
    const fecha = new Date(doc.guardado_en).toLocaleDateString('es-CO', { day: 'numeric', month: 'short', year: 'numeric' });
    
    return `
      <div class="card" style="margin-bottom:10px">
        <div class="between">
          <div style="flex:1">
            <div class="row" style="gap:10px;margin-bottom:6px">
              <span class="idtag">${doc.nombre}</span>
              <span class="small muted mono">📅 ${fecha}</span>
            </div>
            <div class="small muted">Radicado: ${doc.radicado} · Ponente: ${doc.ponente}</div>
            
            <div style="margin-top:10px;">
              <select onchange="cambiarEtiqueta('${doc.sentencia_id}', this.value)" style="padding:4px; border-radius:4px; font-size:12px; border:1px solid var(--beige-d);">
                <option value="">Sin etiqueta</option>
                <option value="estudio" ${doc.etiqueta === 'estudio' ? 'selected' : ''}>Para estudio</option>
                <option value="audiencia" ${doc.etiqueta === 'audiencia' ? 'selected' : ''}>Para audiencia</option>
                <option value="escrito" ${doc.etiqueta === 'escrito' ? 'selected' : ''}>Para citar en escrito</option>
              </select>
            </div>
          </div>
          
          <div class="stack" style="align-items:flex-end;gap:6px">
            <button class="btn btn-o" style="padding:4px 10px;font-size:12px" onclick="verTexto('${e(doc.sentencia_id)}')">Ver texto</button>
            <button class="btn btn-d" style="padding:4px 10px;font-size:12px" onclick="exportarFicha('${doc.sentencia_id}', '${doc.nombre}', '${doc.radicado}', '${doc.ponente}', '${doc.fecha}', '${doc.url_oficial}')">Exportar Ficha</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

async function cambiarEtiqueta(sentencia_id, etiqueta) {
  try {
    await fetch('/api/etiqueta', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario_id: USUARIO_ID, sentencia_id, etiqueta })
    });
    toast('Etiqueta actualizada');
  } catch (e) { toast('Error al guardar etiqueta'); }
}

async function exportarFicha(id, nombre, radicado, ponente, fecha, url) {
  try {
    const res = await fetch(`/api/documentos?usuario_id=${USUARIO_ID}`);
    const data = await res.json();
    const doc = data.documentos.find(d => d.sentencia_id === id);

    const estilos = `
      <style>
        body { font-family: 'Arial', sans-serif; font-size: 11pt; color: #333; }
        h1 { color: #3D2010; font-size: 20pt; text-align: center; }
        h2 { color: #5C3D1E; font-size: 14pt; border-bottom: 1px solid #ccc; padding-bottom: 4px; margin-top: 20px; }
        h3 { color: #7B4F2E; font-size: 12pt; margin-top: 15px; }
        p { line-height: 1.5; text-align: justify; }
        ul { margin-top: 5px; }
        li { margin-bottom: 5px; }
        .meta { font-size: 10pt; color: #555; }
      </style>
    `;

    let htmlContent = `
      ${estilos}
      <h1>Ficha de Jurisprudencia - IurisSearch</h1>
      <h2>${nombre}</h2>
      <p class="meta"><strong>Radicado:</strong> ${radicado}</p>
      <p class="meta"><strong>Ponente:</strong> ${ponente}</p>
      <p class="meta"><strong>Fecha:</strong> ${fecha}</p>
    `;

    if (doc && doc.analisis_json) {
      const r = JSON.parse(doc.analisis_json);
      htmlContent += `
        <p class="meta"><strong>Nivel de Similitud:</strong> ${r.nivel} - ${NIVEL[r.nivel]}</p>
        <p class="meta"><strong>Fuente:</strong> ${r.url || 'Consultar en Rama Judicial'}</p>
        
        <h3>Justificación del Nivel</h3>
        <p>${r.justificacion_nivel}</p>

        <h3>Similitudes con tu caso</h3>
        <ul>${(r.similitudes || []).map(s => `<li>${s}</li>`).join('')}</ul>

        <h3>Diferencias con tu caso</h3>
        <ul>${(r.diferencias || []).map(d => `<li>${d}</li>`).join('')}</ul>

        <h3>Resumen de la Decisión</h3>
        <p><strong>Hechos:</strong> ${r.hechos}</p>
        <p><strong>Problema Jurídico:</strong> ${r.problema_juridico}</p>
        <p><strong>Decisión:</strong> ${r.decision}</p>
        <p><strong>Pena:</strong> ${r.pena}</p>

        <h3>Normas</h3>
        <ul>${(r.normas || []).map(n => `<li>${n}</li>`).join('')}</ul>
      `;
    } else {
      htmlContent += `
        <p class="meta"><strong>Fuente:</strong> ${url || 'Consultar en Rama Judicial'}</p>
        <h3>Análisis o Notas del Caso</h3>
        <p>(Escribe aquí tus conclusiones)</p>
      `;
    }

    descargarWord(htmlContent, `Ficha_${nombre}`);
  } catch (error) {
    console.error(error);
    toast('Error al exportar la ficha');
  }
}

V.docs = () => shell('docs', `<div class="page"><div class="page-h"><div class="eyebrow">Tu selección</div>
<div class="between" style="margin-bottom:20px;">
  <div><h1>Mis documentos</h1><p>Sentencias que has guardado para tu investigación.</p></div>
  <button class="btn btn-d" onclick="exportarWord()">Exportar a Word</button>
</div></div>
<div style="margin-bottom:20px">
  <input type="text" id="buscador-docs" placeholder="Buscar por radicado, ponente o nombre..." 
         style="width:100%; padding:10px; border:1px solid var(--beige-d); border-radius:8px; font-family:var(--sans)"
         onkeyup="filtrarDocumentos()">
</div>
<div class="stack" id="lista-documentos"><div class="soft">Cargando documentos...</div></div></div>`);

async function cargarDocumentosReales() {
  try {
    const res = await fetch(`/api/documentos?usuario_id=${USUARIO_ID}`);
    const data = await res.json();
    const docs = data.documentos || [];
    const contenedor = document.getElementById('lista-documentos');
    if (!contenedor) return; 
    
    if (docs.length === 0) {
      contenedor.innerHTML = '<div class="soft">Aún no has guardado decisiones. Ábrelas desde los resultados y pulsa "Guardar".</div>';
      return;
    }

    let html = '';
    for (const doc of docs) {
      const resNotas = await fetch(`/api/notas?usuario_id=${USUARIO_ID}&sentencia_id=${doc.sentencia_id}`);
      const dataNotas = await resNotas.json();
      const notas = dataNotas.notas || [];

      html += `
      <div class="card" style="margin-bottom:16px">
        <div class="between">
          <div>
            <div class="row" style="gap:10px;margin-bottom:6px">
              <span class="idtag">${doc.nombre}</span>
              <span class="small muted mono">${doc.fecha}</span>
            </div>
            <div class="small muted">Radicado: ${doc.radicado} · Ponente: ${doc.ponente}</div>
          </div>
          <div class="stack" style="align-items:flex-end;gap:6px">
            <button class="btn btn-o" style="padding:4px 10px;font-size:12px" onclick="verTexto('${e(doc.sentencia_id)}')">Leer texto</button>
            <button class="btn" style="padding:4px 10px;font-size:12px;color:var(--bad)" onclick="eliminarDocumento(${doc.id})">Eliminar</button>
          </div>
        </div>
        
        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--beige-d);">
          <label class="small muted" style="font-weight: 600; display:block; margin-bottom:8px;">Tus notas para este caso:</label>
          <div style="margin-bottom:10px;">
            ${notas.length > 0 ? notas.map(n => `
              <div class="nota-bloque">
                <span id="texto-nota-${n.id}" style="flex:1; word-break: break-word;">${e(n.texto)}</span>
                <div class="acciones-nota">
                  <button onclick="prepararEdicionNota(${n.id}, '${e(n.texto).replace(/'/g, "\\'")}')" title="Editar nota">✏️</button>
                  <button onclick="eliminarNota(${n.id}, '${doc.sentencia_id}')" title="Eliminar nota">✖</button>
                </div>
              </div>
            `).join('') : '<div class="small muted" style="margin-bottom:8px;">Aún no hay notas.</div>'}
          </div>
          <div style="display:flex; gap: 8px;">
            <input type="text" id="nota-input-${doc.id}" placeholder="Escribe una nueva nota..." 
                   style="flex:1; padding:8px; border:1px solid var(--beige-d); border-radius:6px; font-size:13px;">
            <button class="btn btn-d" style="padding:8px 12px; font-size:12px;" onclick="agregarNota('${doc.sentencia_id}', ${doc.id})">
              Agregar Nota
            </button>
          </div>
        </div>
      </div>`;
    }
    contenedor.innerHTML = html;
  } catch (e) { console.error(e); toast('Error al cargar documentos'); }
}

async function agregarNota(sentencia_id, doc_id) {
  const input = document.getElementById(`nota-input-${doc_id}`);
  const texto = input.value.trim();
  if (!texto) return toast('Escribe algo para guardar la nota.');
  
  try {
    const res = await fetch('/api/notas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario_id: USUARIO_ID, sentencia_id: sentencia_id, texto: texto })
    });
    if (res.ok) { toast('Nota guardada exitosamente'); cargarDocumentosReales(); }
    else { toast('Error al guardar la nota'); }
  } catch (e) { toast('Error de conexión'); }
}

async function prepararEdicionNota(id, textoActual) {
  const span = document.getElementById(`texto-nota-${id}`);
  if (!span) return;

  span.innerHTML = `
    <input type="text" id="input-edicion-${id}" value="${textoActual.replace(/"/g, '&quot;')}" 
           style="flex:1; padding:4px; border:1px solid var(--gold); border-radius:4px; font-size:13px; margin-right: 8px;">
    <div class="acciones-nota">
      <button onclick="guardarEdicionNota(${id})" style="color:var(--ok); font-weight:bold;">Guardar</button>
      <button onclick="cargarDocumentosReales()" style="color:var(--bad);">Cancelar</button>
    </div>
  `;

function descargarWord(htmlContent, nombreArchivo) {
  const htmlCompleto = `
    <!DOCTYPE html>
    <html>
      <head>
        <meta charset="utf-8">
      </head>
      <body>
        ${htmlContent}
      </body>
    </html>
  `;

  const blob = htmlDocx.asBlob(htmlCompleto);
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nombreArchivo.replace(/[^\w\-]+/g, '_').slice(0, 80) + '.docx';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  window.URL.revokeObjectURL(url);
  toast('Ficha exportada exitosamente');
}

let textoVisorActual = '';
let indiceVisorActual = 0;
function buscarEnTextoVisor() {
  const input = $('buscar-en-sentencia');
  const visor = $('texto-sentencia-visor');
  const contador = $('contador-visor');
  if (!input || !visor || !contador) return;
  const termino = input.value.trim();
  if (!termino) {
    visor.textContent = textoVisorActual;
    contador.textContent = 'Escribe para buscar';
    indiceVisorActual = 0;
    return;
  }
  const base = textoVisorActual.toLocaleLowerCase('es');
  const buscado = termino.toLocaleLowerCase('es');
  let cursor = 0;
  const fragmento = document.createDocumentFragment();
  let total = 0;
  while (cursor < textoVisorActual.length) {
    const pos = base.indexOf(buscado, cursor);
    if (pos < 0) break;
    fragmento.appendChild(document.createTextNode(textoVisorActual.slice(cursor, pos)));
    const marca = document.createElement('mark');
    marca.textContent = textoVisorActual.slice(pos, pos + termino.length);
    marca.className = 'coincidencia-visor';
    fragmento.appendChild(marca);
    cursor = pos + termino.length;
    total++;
  }
  fragmento.appendChild(document.createTextNode(textoVisorActual.slice(cursor)));
  visor.replaceChildren(fragmento);
  indiceVisorActual = 0;
  if (total) {
    marcarCoincidenciaVisor();
  } else {
    contador.textContent = '0 coincidencias';
  }
}
function marcarCoincidenciaVisor() {
  const marcas = [...document.querySelectorAll('#texto-sentencia-visor mark.coincidencia-visor')];
  const contador = $('contador-visor');
  if (!marcas.length || !contador) return;
  indiceVisorActual = ((indiceVisorActual % marcas.length) + marcas.length) % marcas.length;
  marcas.forEach((m,i) => m.classList.toggle('actual', i === indiceVisorActual));
  contador.textContent = `${indiceVisorActual + 1} de ${marcas.length}`;
  marcas[indiceVisorActual].scrollIntoView({block:'center',behavior:'smooth'});
}
function moverCoincidenciaVisor(paso) {
  const marcas = document.querySelectorAll('#texto-sentencia-visor mark.coincidencia-visor');
  if (!marcas.length) return;
  indiceVisorActual += paso;
  marcarCoincidenciaVisor();
}

let busquedaOficialEnCurso=false;
let estadoBusquedaOficial={};
let secuenciaBusquedaOficial=0;
const dormirOficial=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function buscarOficial(cargarMas=false) {
 const campo=document.getElementById('termino-oficial'), salida=document.getElementById('salida-oficial');
 const termino=campo?.value.trim(); if(!termino)return toast('Escribe un término de búsqueda.');
 if(busquedaOficialEnCurso)return toast('Ya hay una búsqueda en curso.');
 if(!cargarMas || termino!==ultimoTermino){oficialesActuales=[];seleccionOficial.clear();offsetOficial=0;analisisOficiales={};}
 ultimoTermino=termino;S.terminoOficial=termino;
 busquedaOficialEnCurso=true;const secuencia=++secuenciaBusquedaOficial;
 estadoBusquedaOficial={etapa:'Iniciando consulta oficial',registros:0,pdfVerificados:0,listosGemini:0,puedeCargarMas:true};
 pintarOficiales(estadoBusquedaOficial);
 try {
  const inicio=await api('/api/oficial/iniciar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({termino,descripcionCaso:(S.text||'').slice(0,6000),desplazamiento:offsetOficial,cantidad:20})});
  const fin=Date.now()+185000;let datos={};
  do {
   await dormirOficial(1500);
   if(secuencia!==secuenciaBusquedaOficial)return;
   datos=await api('/api/oficial/progreso?id='+encodeURIComponent(inicio.id));
   estadoBusquedaOficial={...estadoBusquedaOficial,...datos};
   const conocidos=new Set(oficialesActuales.map(x=>String(x.providencia)+'|'+String(x.radicado)));
   for(const r of datos.resultados||[]){const clave=String(r.providencia)+'|'+String(r.radicado);if(!conocidos.has(clave)){oficialesActuales.push(r);conocidos.add(clave);}}
   pintarOficiales(datos);
   if(datos.estado==='finalizado'||datos.estado==='error')break;
  }while(Date.now()<fin);
  if(datos.estado==='finalizado')offsetOficial=datos.siguienteDesplazamiento??(offsetOficial+(datos.resultados||[]).length);
  if(datos.estado==='error')toast(datos.error||'El portal no completó la consulta.');
  if(datos.estado!=='finalizado'&&datos.estado!=='error')toast('La consulta continúa en el servidor; se conservaron los resultados mostrados.');
  await sincronizarGuardadosOficiales();
 }catch(err){toast(err.message);estadoBusquedaOficial={...estadoBusquedaOficial,estado:'error',error:err.message};pintarOficiales(estadoBusquedaOficial);}
 finally{busquedaOficialEnCurso=false;pintarOficiales(estadoBusquedaOficial);}
}

   coincidencias.push({pagina:p.pagina,inicio:indice,fin:indice+termino.length,fragmento:texto.slice(Math.max(0,indice-90),Math.min(texto.length,indice+termino.length+90)).replace(/\s+/g,' ').trim()});

function seleccionResaltadoOficial(){

function htmlPaginaOficial(p,coincidencias){

 for(const x of [...marcas,...hits]){cortes.add(x.inicio);cortes.add(x.fin);}
 const puntos=[...cortes].sort((a,b)=>a-b);let html='';

 }catch(err){zona.innerHTML=`<div class="err">${e(err.message)}</div>`;}

async function analizar() {
  const caso = ((S.text || '') + '\n\n' + (S.file ? S.file.text : '')).trim();
  if (caso.length < 30) return toast('Describe tu caso (mínimo 30 caracteres) o adjunta un documento');
  Object.assign(S, { running: true, done: false, err: '', paso: 0, fn: 'todos', tab: 'similitudes' });
  go('proc');
  const iv = setInterval(() => { if (S.v === 'proc' && S.paso < ETAPAS.length - 1) { S.paso++; render(); } }, 2200);
  try {
    S.A = await api(`/api/analyze?usuario_id=${USUARIO_ID}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ caso }) });
    S.done = true;
    if (S.v === 'proc') { render(); setTimeout(() => { if (S.v === 'proc') go('res'); }, 700); }
  } catch (x) { S.err = x.message; if (S.v === 'proc') render(); }
  finally { clearInterval(iv); S.running = false; }
}

function abrir(id) { go('det', { sel: id, tab: 'similitudes' }); }

async function guardar(id) {
  const r = S.A?.resultados?.find(x => x.id === id) || S.saved[id];
  if (S.saved[id]) { toast('La sentencia ya está guardada. Puedes eliminarla desde Mis documentos.'); return; }

  S.saved[id] = r;
  toast('Guardando sentencia...');
  
  try {
    const response = await fetch('/api/documentos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        usuario_id: USUARIO_ID,
        sentencia: {
          sentencia_id: r.id, nombre: r.nombre, radicado: r.radicado,
          ponente: r.ponente, fecha: r.fecha, url_oficial: r.url,
          analisis_json: JSON.stringify(r)
        }
      })
    });
    if (response.ok) { toast('Sentencia guardada exitosamente'); } 
    else { toast('Error al guardar la sentencia'); delete S.saved[id]; }
  } catch (e) { console.error(e); toast('Error de conexión'); delete S.saved[id]; }
  render();
}

function contar() {
  const n = S.text.length, p = S.text.trim().split(/\s+/).filter(Boolean).length;
  $('cnt').textContent = `${n} caracteres · ${p} palabras`;
  const c2 = $('cnt2'); c2.textContent = n > 200 ? '✓ Descripción suficiente' : 'Mínimo recomendado: 200 caracteres'; c2.style.color = n > 200 ? 'var(--ok)' : 'var(--coffee-l)';
  document.querySelector('.editor').classList.toggle('lleno', n > 200);
}

async function leerArchivo(f) {
 if(!f)return;toast('Adjuntando '+f.name+'…');
 let t='',pg=0,estado='Adjuntado; extracción no disponible para este formato';
 try {
  if(/\.pdf$/i.test(f.name)){
   if(!window.pdfjsLib)throw new Error('No se cargó el lector PDF.');
   const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;pg=d.numPages;
   for(let i=1;i<=pg;i++){const c=await(await d.getPage(i)).getTextContent();t+=c.items.map(x=>x.str).join(' ')+'\n';}
   estado=t.trim()?'Texto PDF extraído':'PDF sin texto extraíble';
  }else if(/\.(txt|md|csv|json|xml|html|htm|js|ts|py|java|log|yaml|yml)$/i.test(f.name)||f.type.startsWith('text/')){t=await f.text();estado='Texto extraído';}
  S.file={name:f.name,pages:pg,text:t,estado,archivo:f};render();toast(t.trim()?'Archivo adjuntado y leído':'Archivo adjuntado. Escribe el caso para buscar si no puede extraerse su texto.');
 }catch(err){S.file={name:f.name,pages:pg,text:'',estado:'Adjuntado; no se pudo extraer texto',archivo:f};render();toast(err.message);}
}

function cerrarSesion() {
  if (!confirm('¿Estás seguro de que deseas cerrar sesión?')) return;
  document.cookie = "usuario_id=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
  localStorage.removeItem('usuario_id');
  localStorage.removeItem('usuario_nombre');
  window.location.href = '/login';
}

let vistaAnterior = '';
function render() {
  $('r').innerHTML = (V[S.v] || V.landing)();
  
  if (S.v === 'docs') cargarDocumentosReales();
  if (S.v === 'saved') cargarGuardadas();
  if (S.v === 'perfil') cargarPerfil();

  const nombre = localStorage.getItem('usuario_nombre');
  const navNombre = document.getElementById('nombre-usuario-nav');
  if (navNombre && nombre) navNombre.innerText = nombre;

  vistaAnterior = S.v;
}

api('/api/estado').then(x => { S.estado = x; render(); }).catch(() => {});
render();
